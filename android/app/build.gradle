apply plugin: 'com.android.application'

android {
    namespace 'com.megastars.game'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName '0.2'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    flavorDimensions += 'edition'
    productFlavors {
        mobile {
            dimension 'edition'
            applicationId 'com.megastars.game'
            resValue 'string', 'app_name', 'Mega Stars'
            // Redmi Note 8 class hardware and newer, plus x86_64 for emulators.
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        }
        pocket {
            dimension 'edition'
            applicationId 'com.megastars.game.pocket'
            resValue 'string', 'app_name', 'Mega Stars Pocket'
            // Galaxy J5 Prime class hardware: 32 bit ARM only keeps it small.
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
            externalNativeBuild {
                cmake { arguments '-DANDROID_STL=c++_shared', '-DMEGA_ANDROID_POCKET=ON' }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Debug signing so the APK can be installed straight from the site.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
    }
}
